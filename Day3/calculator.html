<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>

<h2>Simple Calculator</h2>

<script>
    let a = 10;
    let b = 5;

    console.log("Addition: " + (a + b) + "<br>");
    console.log("Subtraction: " + (a - b) + "<br>");
    console.log("Multiplication: " + (a * b) + "<br>");
    console.log("Division: " + (a / b));
</script>

</body>
</html>
